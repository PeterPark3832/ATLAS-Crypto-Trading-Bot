# ATLAS — 애플리케이션 로그 회전
# ================================
# 설치:
#   sudo cp deploy/atlas-logrotate.conf /etc/logrotate.d/atlas
#   sudo logrotate -d /etc/logrotate.d/atlas    # 문법 점검(실행 안 함)
#   sudo logrotate -f /etc/logrotate.d/atlas    # 즉시 1회 강제 실행
#
# 왜 필요한가
#   봇은 RotatingFileHandler로 로그를 회전시키지만, 그 핸들러가 쓰는 파일은
#   logs/atlas_spot_<날짜>.log 다. 반면 systemd 유닛은 stdout/stderr를
#   logs/spot_main.log 에 append 하고, **대시보드가 파싱하는 건 이 파일**이다
#   (atlas_web_dashboard.LOG_FILE). 즉 보호가 필요한 파일에는 회전이 없었다.
#   실측 증가 속도 약 1.4MB/일 → 방치하면 연 500MB, 대시보드 파싱도 함께 느려진다.
#   dashboard.log 도 같은 이유로 회전 대상이 없어 이미 5.4MB까지 자랐다.
#
# copytruncate 가 필수인 이유
#   systemd의 `StandardOutput=append:` 는 파일을 열어 fd를 붙잡고 있다.
#   기본 방식(rename 후 create)으로 회전하면 systemd는 **이름이 바뀐 옛 inode**에
#   계속 쓰고, 새 파일은 영원히 비어 있게 된다. copytruncate 는 내용을 복사한 뒤
#   원본을 그 자리에서 비우므로 inode가 유지돼 그런 일이 없다.
#   (복사와 truncate 사이에 쓰인 몇 줄이 유실될 수 있으나, 운영 로그라 허용된다)

# 시간이 아니라 **크기** 기준으로만 회전한다.
#   대시보드는 spot_main.log의 *내용*을 파싱해 레짐을 뽑는다. 회전으로 파일이
#   비면 다음 레짐 로그(시간당 1회)가 찍힐 때까지 화면에서 레짐이 사라진다.
#   실제로 강제 회전 직후 /api/status의 regime이 null로 떨어지는 것을 확인했다.
#   daily로 두면 이 공백이 **매일** 생긴다. 20MB 기준이면 실측 증가 속도
#   (약 1.4MB/일)로 2주에 한 번이라 노출이 1/14로 줄고, 디스크 상한
#   (20MB × 14 + 압축분)은 그대로 지켜진다.
/root/atlas_spot/logs/*.log {
    size 20M
    rotate 14
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
    su root root
}
