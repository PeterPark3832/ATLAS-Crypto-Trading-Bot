<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ATLAS v2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:       #0a0c12;
  --bg2:      #111520;
  --card:     #141824;
  --border:   rgba(255,255,255,0.07);
  --text:     #e2e8f0;
  --dim:      #4a5568;
  --blue:     #4f8ef7;
  --green:    #10b981;
  --red:      #f43f5e;
  --yellow:   #f59e0b;
  --purple:   #8b5cf6;
  --radius:   12px;
  --shadow:   0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;outline:none}

/* ── 로그인 ── */
#login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:340px;text-align:center;box-shadow:var(--shadow)}
.login-box h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.5px}
.login-box p{color:var(--dim);font-size:13px;margin-bottom:28px}
.login-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:15px;margin-bottom:12px;transition:border-color .2s}
.login-box input:focus{outline:none;border-color:var(--blue)}
.login-box button{width:100%;background:var(--blue);color:#fff;padding:12px;border-radius:8px;font-size:15px;font-weight:600;transition:opacity .2s}
.login-box button:hover{opacity:.85}
.login-box .err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

/* ── 레이아웃 ── */
#app{display:none;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.topbar-left{display:flex;align-items:center;gap:12px}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.topbar-right{display:flex;align-items:center;gap:10px}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:8px;font-size:12px;transition:all .2s}
.btn-sm:hover{color:var(--text);border-color:rgba(255,255,255,0.15)}
.updated{color:var(--dim);font-size:11px}

.main{padding:20px 24px;max-width:1400px;margin:0 auto}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.kpi.blue::before{background:var(--blue)}
.kpi.green::before{background:var(--green)}
.kpi.red::before{background:var(--red)}
.kpi.yellow::before{background:var(--yellow)}
.kpi.purple::before{background:var(--purple)}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:700;letter-spacing:-0.5px;line-height:1}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:4px}

/* ── 배지 ── */
.regime-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.streak-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}

/* ── 차트 영역 ── */
.chart-row{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:16px}
.chart-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.chart-wrap{position:relative;height:200px}
.chart-wrap.tall{height:260px}

/* ── 테이블 ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.tag.long{background:rgba(16,185,129,.15);color:var(--green)}
.tag.short{background:rgba(244,63,94,.15);color:var(--red)}
.tag.tp{background:rgba(16,185,129,.15);color:var(--green)}
.tag.sl{background:rgba(244,63,94,.15);color:var(--red)}
.tag.time{background:rgba(79,142,247,.15);color:var(--blue)}
.pos{color:var(--green)}
.neg{color:var(--red)}
.warn{color:var(--yellow);font-size:11px}
.ok{color:var(--green);font-size:11px}

/* ── 탭 ── */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.active{color:var(--text);border-bottom-color:var(--blue)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── 섹션 헤더 ── */
.section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-hdr h3{font-size:13px;font-weight:600}
.badge-num{background:var(--bg2);border:1px solid var(--border);padding:2px 7px;border-radius:6px;font-size:11px;color:var(--dim)}

/* ── 기간 필터 ── */
.period-group{display:flex;gap:6px}
.period-btn{background:var(--bg2);border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:6px;font-size:11px;transition:all .2s}
.period-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ── 모바일 ── */
@media(max-width:768px){
  .topbar{padding:12px 16px}
  .main{padding:12px 14px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .kpi-row .kpi:last-child{grid-column:span 2}
  .kpi-val{font-size:20px}
  .chart-row,.chart-row2{grid-template-columns:1fr}
  .updated{display:none}
  th,td{padding:7px 8px;font-size:12px}
  .tab{padding:8px 10px;font-size:12px}
}
@media(max-width:480px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .kpi-row .kpi:last-child{grid-column:auto}
}

/* ── 로딩 ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--dim);font-size:13px}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-overlay">
  <div class="login-box">
    <h1>📈 ATLAS v2</h1>
    <p>대시보드 접속 비밀번호를 입력하세요</p>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">로그인</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <!-- 상단바 -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">📈 ATLAS v2</div>
      <div id="regime-badge"></div>
      <div id="streak-badge"></div>
    </div>
    <div class="topbar-right">
      <div class="updated" id="updated-at"></div>
      <button class="btn-sm" onclick="refresh()"><span id="refresh-icon">↻</span> 갱신</button>
      <button class="btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="main">
    <!-- 기간 필터 -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="period-group">
        <button class="period-btn active" data-days="0" onclick="setPeriod(this)">전체</button>
        <button class="period-btn" data-days="30" onclick="setPeriod(this)">30일</button>
        <button class="period-btn" data-days="7" onclick="setPeriod(this)">7일</button>
        <button class="period-btn" data-days="1" onclick="setPeriod(this)">오늘</button>
      </div>
    </div>

    <!-- KPI 카드 -->
    <div class="kpi-row">
      <div class="kpi" id="kpi-pnl">
        <div class="kpi-label">총 PnL</div>
        <div class="kpi-val" id="k-pnl">—</div>
        <div class="kpi-sub" id="k-equity">잔고 —</div>
      </div>
      <div class="kpi" id="kpi-wr">
        <div class="kpi-label">승률</div>
        <div class="kpi-val" id="k-wr">—</div>
        <div class="kpi-sub" id="k-wl">— W / — L</div>
      </div>
      <div class="kpi" id="kpi-pf">
        <div class="kpi-label">Profit Factor</div>
        <div class="kpi-val" id="k-pf">—</div>
        <div class="kpi-sub" id="k-avgr">avg R —</div>
      </div>
      <div class="kpi" id="kpi-mdd">
        <div class="kpi-label">MDD</div>
        <div class="kpi-val" id="k-mdd">—</div>
        <div class="kpi-sub" id="k-sharpe">Sharpe —</div>
      </div>
      <div class="kpi purple">
        <div class="kpi-label">총 거래수</div>
        <div class="kpi-val" id="k-total">—</div>
        <div class="kpi-sub" id="k-module">모듈 —</div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview',this)">📊 Overview</div>
      <div class="tab" onclick="switchTab('positions',this)">📋 포지션</div>
      <div class="tab" onclick="switchTab('analysis',this)">📈 분석</div>
    </div>

    <!-- Overview 탭 -->
    <div id="tab-overview" class="tab-content active">
      <div class="chart-row">
        <div class="card">
          <div class="card-title">수익 곡선</div>
          <div class="chart-wrap tall"><canvas id="eq-chart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">일별 PnL (최근 30일)</div>
          <div class="chart-wrap tall"><canvas id="daily-chart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- 포지션 탭 -->
    <div id="tab-positions" class="tab-content">
      <div class="card" style="margin-bottom:12px">
        <div class="section-hdr">
          <h3>열린 포지션</h3>
          <span class="badge-num" id="pos-count">0개</span>
        </div>
        <div class="tbl-wrap" id="pos-table">
          <div class="empty">포지션 없음</div>
        </div>
      </div>
      <div class="card">
        <div class="section-hdr">
          <h3>최근 거래</h3>
          <span class="badge-num">최근 20건</span>
        </div>
        <div class="tbl-wrap" id="trades-table">
          <div class="empty">거래 내역 없음</div>
        </div>
      </div>
    </div>

    <!-- 분석 탭 -->
    <div id="tab-analysis" class="tab-content">
      <div class="chart-row2">
        <div class="card">
          <div class="card-title">모듈별 성과</div>
          <div class="tbl-wrap" id="module-table">
            <div class="empty">데이터 없음</div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">전략별 PnL</div>
          <div class="chart-wrap"><canvas id="mod-chart"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('atlas_token') || '';
let currentPeriod = 0;
let eqChart = null, dailyChart = null, modChart = null;
let refreshTimer = null;

// ── 인증 ──────────────────────────────────────────────────────
async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  try {
    const res = await fetch('/api/auth', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if (!res.ok) { err.textContent = '비밀번호가 틀렸습니다.'; return; }
    const data = await res.json();
    TOKEN = data.token;
    localStorage.setItem('atlas_token', TOKEN);
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadDashboard();
  } catch(e) { err.textContent = '서버 연결 오류'; }
}

function logout() {
  localStorage.removeItem('atlas_token');
  location.reload();
}

// ── 초기화 ────────────────────────────────────────────────────
window.onload = () => {
  if (TOKEN) {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadDashboard();
  }
};

// ── 데이터 로드 ───────────────────────────────────────────────
async function loadDashboard() {
  setRefreshIcon(true);
  try {
    const res = await fetch(`/api/dashboard?token=${TOKEN}&period=${currentPeriod}`);
    if (res.status === 401) { logout(); return; }
    const d = await res.json();
    render(d);
    scheduleRefresh(d.refresh_sec || 60);
  } catch(e) { console.error(e); }
  setRefreshIcon(false);
}

function refresh() { clearTimeout(refreshTimer); loadDashboard(); }
function scheduleRefresh(sec) {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => loadDashboard(), sec * 1000);
}
function setRefreshIcon(loading) {
  document.getElementById('refresh-icon').innerHTML = loading ? '<span class="spinner"></span>' : '↻';
}
function setPeriod(btn) {
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = parseInt(btn.dataset.days);
  loadDashboard();
}
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

// ── 렌더 ─────────────────────────────────────────────────────
function render(d) {
  const m = d.metrics;
  document.getElementById('updated-at').textContent = d.updated_at;

  // KPI
  const pnlEl = document.getElementById('k-pnl');
  pnlEl.textContent = `$${m.total_pnl >= 0 ? '+' : ''}${m.total_pnl.toFixed(2)}`;
  pnlEl.className = 'kpi-val ' + (m.total_pnl >= 0 ? 'pos' : 'neg');
  document.getElementById('k-equity').textContent = `잔고 $${m.equity.toFixed(2)}`;
  document.getElementById('kpi-pnl').className = 'kpi ' + (m.total_pnl >= 0 ? 'green' : 'red');

  const wrEl = document.getElementById('k-wr');
  wrEl.textContent = `${m.wr.toFixed(0)}%`;
  wrEl.className = 'kpi-val ' + (m.wr >= 40 ? 'pos' : m.wr >= 33 ? '' : 'neg');
  document.getElementById('k-wl').textContent = `${m.wins}W / ${m.total - m.wins}L`;
  document.getElementById('kpi-wr').className = 'kpi ' + (m.wr >= 40 ? 'green' : m.wr >= 33 ? 'yellow' : 'red');

  const pfEl = document.getElementById('k-pf');
  pfEl.textContent = m.pf > 0 ? m.pf.toFixed(2) : '—';
  pfEl.className = 'kpi-val ' + (m.pf >= 1.2 ? 'pos' : m.pf >= 1.0 ? '' : 'neg');
  document.getElementById('k-avgr').textContent = `avg R ${m.avg_r >= 0 ? '+' : ''}${m.avg_r.toFixed(3)}`;
  document.getElementById('kpi-pf').className = 'kpi ' + (m.pf >= 1.2 ? 'green' : m.pf >= 1.0 ? 'yellow' : 'red');

  const mddEl = document.getElementById('k-mdd');
  mddEl.textContent = `${m.mdd_pct.toFixed(1)}%`;
  mddEl.className = 'kpi-val ' + (m.mdd_pct > 10 ? 'neg' : m.mdd_pct > 5 ? '' : 'pos');
  document.getElementById('k-sharpe').textContent = `Sharpe ${m.sharpe.toFixed(2)}`;
  document.getElementById('kpi-mdd').className = 'kpi ' + (m.mdd_pct > 10 ? 'red' : m.mdd_pct > 5 ? 'yellow' : 'green');

  document.getElementById('k-total').textContent = `${m.total}건`;
  document.getElementById('k-module').textContent = currentPeriod > 0 ? `${currentPeriod}일 기준` : '전체 기준';

  // 레짐 배지
  renderRegime(d.regime);

  // 스트릭
  renderStreak(d.streak);

  // 차트
  renderEqChart(d.eq_curve);
  renderDailyChart(d.daily);
  renderModChart(d.module_stats);

  // 모듈 테이블
  renderModuleTable(d.module_stats);

  // 포지션
  renderPositions(d.open_pos);

  // 최근 거래
  renderTrades(d.recent);
}

// ── 레짐 배지 ──────────────────────────────────────────────────
const REGIME_CFG = {
  'TRENDING_UP':   ['#10b981','🟢 TRENDING UP'],
  'TRENDING_DOWN': ['#f43f5e','🔴 TRENDING DOWN'],
  'RANGING':       ['#f59e0b','🟡 RANGING'],
  'WEAK_TREND':    ['#4f8ef7','🔵 WEAK TREND'],
  'CRISIS':        ['#8b5cf6','🟣 CRISIS'],
};
function renderRegime(r) {
  const [color, label] = REGIME_CFG[r] || ['#64748b', `⚪ ${r}`];
  document.getElementById('regime-badge').innerHTML =
    `<span class="regime-badge" style="background:${color}18;color:${color};border-color:${color}44">${label}</span>`;
}

function renderStreak(s) {
  if (!s || s.kind === 'none' || s.count === 0) { document.getElementById('streak-badge').innerHTML=''; return; }
  const [icon, color] = s.kind === 'win' ? ['🔥','#10b981'] : ['❄️','#f43f5e'];
  document.getElementById('streak-badge').innerHTML =
    `<span class="streak-badge" style="background:${color}18;color:${color};border:1px solid ${color}33">${icon} ${s.count}${s.kind==='win'?'연승':'연패'}</span>`;
}

// ── 차트 공통 옵션 ─────────────────────────────────────────────
const DARK = {
  plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e2433',titleColor:'#94a3b8',bodyColor:'#e2e8f0',borderColor:'rgba(255,255,255,0.08)',borderWidth:1,padding:10,cornerRadius:8}},
  scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#4a5568',font:{size:10}}},
          y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#4a5568',font:{size:10}}}},
  responsive:true,maintainAspectRatio:false,animation:{duration:400}
};

function renderEqChart(data) {
  const ctx = document.getElementById('eq-chart').getContext('2d');
  if (eqChart) eqChart.destroy();
  if (!data.length) return;

  const labels = data.map(d => { const dt = new Date(d.ts); return `${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')}`; });
  const values = data.map(d => d.eq);
  const lastVal = values[values.length-1];
  const color = lastVal >= 1000 ? '#10b981' : '#f43f5e';

  const grad = ctx.createLinearGradient(0,0,0,260);
  grad.addColorStop(0, color+'33'); grad.addColorStop(1, color+'00');

  eqChart = new Chart(ctx, {type:'line', data:{
    labels, datasets:[{data:values, borderColor:color, borderWidth:2,
      fill:true, backgroundColor:grad, pointRadius:3, pointBackgroundColor:color,
      pointHoverRadius:5, tension:0.3}]
  }, options:{...DARK, plugins:{...DARK.plugins,
    tooltip:{...DARK.plugins.tooltip, callbacks:{label: ctx => `$${ctx.parsed.y.toFixed(2)}`}}}}});
}

function renderDailyChart(data) {
  const ctx = document.getElementById('daily-chart').getContext('2d');
  if (dailyChart) dailyChart.destroy();
  if (!data.length) return;

  dailyChart = new Chart(ctx, {type:'bar', data:{
    labels: data.map(d=>d.date),
    datasets:[{data:data.map(d=>d.pnl),
      backgroundColor:data.map(d=>d.pnl>=0?'rgba(16,185,129,0.7)':'rgba(244,63,94,0.7)'),
      borderRadius:4, borderSkipped:false}]
  }, options:{...DARK, plugins:{...DARK.plugins,
    tooltip:{...DARK.plugins.tooltip, callbacks:{label:ctx=>`${ctx.parsed.y>=0?'+':''}$${ctx.parsed.y.toFixed(2)}`}}}}});
}

function renderModChart(stats) {
  const ctx = document.getElementById('mod-chart').getContext('2d');
  if (modChart) modChart.destroy();
  if (!stats.length) return;

  modChart = new Chart(ctx, {type:'bar', data:{
    labels: stats.map(s=>s.module),
    datasets:[{data:stats.map(s=>s.pnl), label:'PnL',
      backgroundColor:stats.map(s=>s.pnl>=0?'rgba(16,185,129,0.7)':'rgba(244,63,94,0.7)'),
      borderRadius:4, borderSkipped:false}]
  }, options:{...DARK, indexAxis:'y', plugins:{...DARK.plugins,
    tooltip:{...DARK.plugins.tooltip, callbacks:{label:ctx=>`${ctx.parsed.x>=0?'+':''}$${ctx.parsed.x.toFixed(2)}`}}}}});
}

// ── 모듈 테이블 ──────────────────────────────────────────────
function renderModuleTable(stats) {
  const el = document.getElementById('module-table');
  if (!stats.length) { el.innerHTML='<div class="empty">데이터 없음</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>모듈</th><th>거래</th><th>승률</th><th>PF</th><th>총PnL</th><th>avgR</th><th></th></tr></thead>
    <tbody>${stats.map(s=>`<tr>
      <td style="font-weight:600">${s.module}</td>
      <td>${s.trades}</td>
      <td class="${s.wr>=40?'pos':s.wr>=33?'':'neg'}">${s.wr}%</td>
      <td class="${s.pf>=1.2?'pos':s.pf>=1.0?'':'neg'}">${s.pf}</td>
      <td class="${s.pnl>=0?'pos':'neg'}">${s.pnl>=0?'+':''}$${s.pnl.toFixed(2)}</td>
      <td class="${s.avg_r>=0?'pos':'neg'}">${s.avg_r>=0?'+':''}${s.avg_r.toFixed(3)}</td>
      <td>${s.reliable?'<span class="ok">✓</span>':'<span class="warn">⚠</span>'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── 포지션 테이블 ─────────────────────────────────────────────
async function renderPositions(pos) {
  const el = document.getElementById('pos-table');
  document.getElementById('pos-count').textContent = `${pos.length}개`;
  if (!pos.length) { el.innerHTML='<div class="empty">열린 포지션 없음</div>'; return; }

  // 실시간 가격
  const syms = [...new Set(pos.map(p=>p.symbol))].join(',');
  let prices = {};
  try {
    const r = await fetch(`/api/prices?token=${TOKEN}&symbols=${syms}`);
    if (r.ok) prices = await r.json();
  } catch(e){}

  el.innerHTML = `<table>
    <thead><tr><th>전략</th><th>심볼</th><th>방향</th><th>진입가</th><th>현재가</th><th>미실현PnL</th><th>SL</th><th>TP</th><th>레버리지</th></tr></thead>
    <tbody>${pos.map(p=>{
      const cur = prices[p.symbol] || 0;
      let upnl = '—', upnlClass = '';
      if (cur > 0) {
        const v = p.direction==='LONG' ? (cur-p.entry)*p.qty : (p.entry-cur)*p.qty;
        upnl = `${v>=0?'+':''}$${v.toFixed(2)}`; upnlClass = v>=0?'pos':'neg';
      }
      return `<tr>
        <td style="font-size:11px;color:var(--dim)">${p.strategy}</td>
        <td style="font-weight:600">${p.symbol.replace('USDT','')}</td>
        <td><span class="tag ${p.direction.toLowerCase()}">${p.direction==='LONG'?'L':'S'}</span></td>
        <td>${p.entry.toLocaleString()}</td>
        <td>${cur>0?cur.toLocaleString():'—'}</td>
        <td class="${upnlClass}" style="font-weight:600">${upnl}</td>
        <td style="color:var(--red)">${p.sl.toLocaleString()}</td>
        <td style="color:var(--green)">${p.tp.toLocaleString()}</td>
        <td style="color:var(--dim)">${p.leverage}x</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

// ── 거래 테이블 ───────────────────────────────────────────────
function renderTrades(trades) {
  const el = document.getElementById('trades-table');
  if (!trades.length) { el.innerHTML='<div class="empty">거래 내역 없음</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>시간</th><th>전략</th><th>심볼</th><th>방향</th><th>진입가</th><th>청산가</th><th>PnL</th><th>R</th><th>사유</th><th>레짐</th></tr></thead>
    <tbody>${trades.map(t=>`<tr>
      <td style="color:var(--dim)">${t.ts}</td>
      <td style="font-size:11px;color:var(--dim)">${t.strategy}</td>
      <td style="font-weight:600">${t.symbol.replace('USDT','')}</td>
      <td><span class="tag ${t.direction.toLowerCase()}">${t.direction==='LONG'?'L':'S'}</span></td>
      <td>${t.entry.toLocaleString()}</td>
      <td>${t.exit.toLocaleString()}</td>
      <td class="${t.pnl>=0?'pos':'neg'}" style="font-weight:600">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</td>
      <td class="${t.r>=0?'pos':'neg'}">${t.r>=0?'+':''}${t.r.toFixed(2)}R</td>
      <td><span class="tag ${t.reason.toLowerCase()}">${t.reason}</span></td>
      <td style="font-size:11px;color:var(--dim)">${t.regime||'—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}
</script>
</body>
</html>
